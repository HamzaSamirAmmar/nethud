name: NetHUD
options:
  bundleIdPrefix: personal.hamza
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  NetHUD:
    type: application
    platform: macOS
    sources:
      - path: NetHUD/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.hamza.nethud
        PRODUCT_NAME: NetHUD
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: NetHUD
        INFOPLIST_KEY_LSUIElement: "YES"
        DEVELOPMENT_ASSET_PATHS: ""

schemes:
  NetHUD:
    build:
      targets:
        NetHUD: all
    run:
      config: Debug
