name: NetHUD
options:
  bundleIdPrefix: personal.hamza
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  NetHUD:
    type: application
    platform: macOS
    sources:
      - path: NetHUD/Sources
      - path: NetHUD/Resources
    info:
      path: NetHUD/Info.plist
      properties:
        CFBundleDisplayName: NetHUD
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.0.1"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.hamza.nethud
        PRODUCT_NAME: NetHUD
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  NetHUD:
    build:
      targets:
        NetHUD: all
    run:
      config: Debug
